name: Sync PDP image captions

# Saves the AEM PDP Gallery assets JSON as src/pdp-image-caption/en.json (source
# file for memoQ), once a week. Same structure as the AEM response ({count, items:
# [{metadata}]}), but each item keeps only the fields listed in FIELDS.
# Commits only when the file changed (assets added, changed or removed).
# A failed, incomplete or much smaller response never overwrites the file.

on:
  schedule:
    - cron: '0 3 * * 1' # every Monday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-pdp-image-caption
  cancel-in-progress: false

permissions:
  contents: write

env:
  SOURCE_URL: https://publish-p165966-e1845332.adobeaemcloud.com/content.assets-sitemap.json?path=/content/dam/leica-microsystems/kontainer-poc/PDP%20Gallery
  TARGET: src/pdp-image-caption/en.json
  FIELDS: uniqueId,title,description,lmsalttext,scene7url
  MAX_DROP_PERCENT: 20

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download assets JSON
        run: |
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 10 --retry-all-errors --max-time 120 \
            "$SOURCE_URL" -o "$RUNNER_TEMP/assets.json"

      - name: Check the download
        run: |
          NEW="$RUNNER_TEMP/assets.json"
          jq -e '.items | type == "array"' "$NEW" > /dev/null \
            || { echo "::error::Response is not the expected assets JSON"; exit 1; }
          ITEMS=$(jq '.items | length' "$NEW")
          COUNT=$(jq '.count // (.items | length)' "$NEW")
          [ "$COUNT" -eq "$ITEMS" ] \
            || { echo "::error::Incomplete response: count $COUNT, items $ITEMS"; exit 1; }
          if [ -f "$TARGET" ]; then
            BEFORE=$(jq '.items | length' "$TARGET")
            MIN=$(( BEFORE * (100 - MAX_DROP_PERCENT) / 100 ))
            [ "$ITEMS" -ge "$MIN" ] \
              || { echo "::error::Asset count dropped from $BEFORE to $ITEMS; file left unchanged"; exit 1; }
            echo "Assets: $BEFORE -> $ITEMS"
          else
            echo "Assets: $ITEMS (new file)"
          fi

      - name: Keep only the translation fields
        run: |
          jq --arg fields "$FIELDS" '
            ($fields | split(",")) as $keep
            | {
                count: (.items | length),
                items: [.items[] | {
                  metadata: (.metadata // {}
                    | with_entries(select(.key as $k | $keep | index($k)) | select(.value != null)))
                }]
              }
          ' "$RUNNER_TEMP/assets.json" > "$RUNNER_TEMP/en.json"
          echo "Size: $(wc -c < "$RUNNER_TEMP/assets.json") -> $(wc -c < "$RUNNER_TEMP/en.json") bytes"

      - name: Save and commit if changed
        run: |
          mkdir -p "$(dirname "$TARGET")"
          cp "$RUNNER_TEMP/en.json" "$TARGET"
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update PDP image captions (en.json)"
          git push
